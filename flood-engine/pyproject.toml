[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flood-engine"
version = "0.1.0"
description = "VEKTRA Stage 1 simulation engine: an Earth-Observation-driven urban pluvial flood digital twin (WCA2D reduced-complexity overland-flow solver). Implements the frozen Scientific Design Specification and Numerical Model Specification recorded in the project plan; see README.md."
readme = "README.md"
requires-python = ">=3.14"
# Every entry below is justified in the plan record's Step 3 review against
# a specific SDS/NMS/architecture requirement -- none are here "because
# they are common." Version floors are my last-verified-stable knowledge
# expressed as compatible-release ranges, not a claim of knowing today's
# exact latest patch; spot-check against real available versions
# (`pip index versions <pkg>`) before installing, don't trust blindly.
dependencies = [
    "numpy>=2.1,<3",
    "rasterio>=1.3,<2",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    # Step 19, Part G: real cross-process integration testing needs the
    # FastAPI app actually served over a real TCP socket -- FastAPI's own
    # in-process TestClient (used by every Python-side API test) has no
    # such requirement, but the Node backend's real HTTP client does.
    # Dev-only: no production deployment/entrypoint for the API service
    # exists yet (out of scope for Step 19, a Node-integration step, not
    # a deployment step) -- this exists to make real testing possible,
    # not to ship a server.
    "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flood_engine"]

# --- Tool configuration only below this line: no dependency declarations ---

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python 3.14 idioms)
    "B",   # flake8-bugbear (likely-bug patterns)
    "N",   # pep8-naming
    "D",   # pydocstyle -- coding standard: every module/class/function documented
    "ANN", # flake8-annotations -- coding standard: every function typed
]
ignore = [
    "D203", # incompatible with D211 (no blank line before class docstring)
    "D213", # incompatible with D212 (multi-line docstring summary on first line)
]

[tool.ruff.lint.per-file-ignores]
# Test functions are exempt from docstring/full-annotation strictness --
# their names document intent and pytest fixtures are conventionally untyped.
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# rasterio ships no py.typed marker / stubs at all (confirmed empirically
# at Step 6: mypy's own "missing library stubs or py.typed marker"
# message, not assumed). Per the frozen dependency/typing hierarchy
# (prefer real hints -> local wrapper types -> targeted ignore -> never
# disable strict mode globally): this override affects only how mypy
# treats symbols imported FROM rasterio -- flood_engine's own code, in
# this and every other module, remains fully strict-checked. It is
# intentionally scoped to exactly this library, not a blanket relaxation.
[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

# Same situation, same policy, extended at Step 9: geopandas and shapely
# ship no py.typed marker / stubs either (confirmed empirically, not
# assumed). Implementation-support configuration change, not an
# architectural one -- applies the existing rasterio precedent to two
# more libraries with the identical justification; does not relax
# strict mode for flood_engine's own code.
[[tool.mypy.overrides]]
module = "geopandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# --cov* here is now safe to enable: pytest-cov is declared in
# [dependency-groups.dev] above as of this step.
addopts = "-ra --strict-markers --strict-config --cov=flood_engine --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/flood_engine"]
branch = true
# Real orchestration entrypoints that talk to genuine external
# infrastructure (Overpass API, a live PostgreSQL database, real DEM/
# land-cover files on disk) with no seam to fake without misrepresenting
# what "real execution" verified this session. Exercised by actually
# running them (documented in the real-Mumbai-data ingestion/city-scale
# validation work), not by the automated suite -- matching this file's
# own "infrastructure packages are harder to reach [the coverage floor]
# without heavy mocking" rationale below, extended to whole-module scope
# for these three specifically.
omit = [
    "src/flood_engine/aoi/boundary.py",
    "src/flood_engine/cli/run_city_scale.py",
    "src/flood_engine/cli/prepare_demo_scenario.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Reasoned starting floor, not arbitrary: flood_engine.core is pure logic
# with no I/O, so it has no excuse for gaps -- Experiment Plan items 1-4
# (rainfall/roughness/DEM/timestep sensitivity) each exercise the solver
# directly and will naturally push core/ coverage well above this floor.
# Infrastructure packages (api/, persistence/, jobs/) are harder to reach
# this high without heavy mocking; this project-wide floor may be split
# per-package once real code exists to calibrate against -- not committed
# to permanently here.
fail_under = 85
