# VEKTRA docker-compose — Sections 7 (Modularity) and 34 (Deployment
# Strategy: "Docker Compose for local/development environment
# orchestration... single-node deployment").
#
# Phase 2H (Docker & Deployment): three real, buildable services — `db`,
# `backend`, `frontend`. This reflects the IMPLEMENTED architecture, not
# the EDD's original conceptual layout: ingestion (FR-1..FR-5) and
# simulation (FR-7, FR-9) are NOT separate services here, because they
# were never built as separate applications. They are TypeScript CLI
# entry points inside backend/src (backend/src/ingestion/run*.ts,
# backend/src/simulation/run*.ts, run via `npm run ingest:*` /
# `npm run simulate:*` — see backend/package.json), compiled into the
# exact same dist/ this backend image already ships. They are invoked as
# one-shot commands against the running `backend` image/service, e.g.:
#
#   docker compose run --rm backend npm run ingest:osm
#   docker compose run --rm backend npm run simulate:heat-exposure
#
# No `ingestion`/`simulation` service definitions exist below. Adding
# `build: ./ingestion` / `build: ./simulation` stubs (as a prior phase's
# compose file did) would point at directories containing no application
# code and no Dockerfile (ingestion/, simulation/ at repo root remain
# Phase 1 scaffolding — READMEs only) and would fail immediately, while
# also misrepresenting where the real, working implementation actually
# lives.
#
# Required environment variables (see .env.example): POSTGRES_DB,
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_SUPERUSER_PASSWORD,
# BACKEND_PORT, LOG_LEVEL, CORS_ALLOWED_ORIGINS, FRONTEND_PORT,
# VITE_API_BASE_URL, VITE_CESIUM_ION_TOKEN. See this subsystem's review
# for why POSTGRES_USER/PASSWORD (the backend's existing, established
# meaning: "a login role granted membership in vektra_backend_api, never
# a superuser") cannot double as the db container's own bootstrap-
# superuser credential, and why POSTGRES_SUPERUSER_PASSWORD exists.

services:
  db: # PostgreSQL + PostGIS — Section 12, 16
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Consumed only by db/docker/03-create-app-role.sh, never by the
      # postgis image's own entrypoint — deliberately NOT named
      # POSTGRES_USER/POSTGRES_PASSWORD here, which would make the app
      # role the bootstrap superuser instead of a restricted login role.
      VEKTRA_APP_DB_USER: ${POSTGRES_USER}
      VEKTRA_APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, in this order, only on first startup of an empty data
      # volume (docker-entrypoint-initdb.d's own documented behavior) —
      # the real schema/seed/role-provisioning this project already has,
      # not a Docker-specific duplicate.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seeds/0001_data_sources.sql:/docker-entrypoint-initdb.d/02-seed-data-sources.sql:ro
      - ./db/docker/03-create-app-role.sh:/docker-entrypoint-initdb.d/03-create-app-role.sh:ro
    # No ports published to the host — "isolated internal network":
    # reachable from other containers on vektra_internal only. Use
    # `docker compose exec db psql ...` for direct local access.
    networks:
      - vektra_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend: # Node.js + TypeScript API layer — Section 21, 23
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      BACKEND_PORT: ${BACKEND_PORT}
      # Container-to-container DNS name on vektra_internal, never
      # localhost/127.0.0.1 inside the container.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      # RATE_LIMIT_WINDOW_MS / RATE_LIMIT_MAX_REQUESTS deliberately NOT
      # listed here. Discovered during real verification: env.schema.ts's
      # z.coerce.number() turns an EMPTY STRING into 0 (a JS coercion
      # quirk — Number("") === 0), which then fails .positive() — not the
      # same as the variable being genuinely absent, which .optional()
      # handles correctly. Compose's ${VAR:-} substitution always
      # produces a value (empty string when VAR is unset), so it can
      # never represent "absent" for these two — only actually omitting
      # the keys does. This is a deployment-config fix, not an
      # application bug: env.schema.ts's validation is correct given
      # RATE_LIMIT_ENABLED defaults to false, both are unused. An
      # operator enabling rate limiting in this stack must add both keys
      # here explicitly with real values.
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - vektra_internal
    depends_on:
      # condition: service_healthy, not the bare form — startup ordering
      # is not "assume db is up because it started first," it's "wait
      # until db's own healthcheck (pg_isready) actually passes," which
      # (per docker-entrypoint-initdb.d's documented behavior) only
      # happens after 01/02/03-*.sql above have already completed.
      db:
        condition: service_healthy
    # Second, independent mechanism (not relying on depends_on alone):
    # if the backend ever does start before Postgres is truly reachable,
    # src/server.ts's existing startup health check (Server Bootstrap
    # subsystem, unmodified here) exits 1 rather than serving traffic
    # against a broken connection — Docker's own supervisor retries via
    # this policy.
    restart: on-failure
    # Runs tini as PID 1 for correct SIGTERM forwarding and zombie
    # reaping — see Dockerfile's own note on why exec-form CMD alone
    # isn't sufficient.
    init: true
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend: # TypeScript + CesiumJS client — Section 20, 22
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time only (frontend/Dockerfile's own note: Vite compiles
        # these into the static JS bundle when `vite build` runs, inside
        # this build step — they are never read again at container
        # start). VITE_API_BASE_URL must be a URL the END USER'S BROWSER
        # can reach (the backend's host-published port below), never the
        # `backend` container-DNS name — a browser cannot resolve that.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
    environment:
      # Runtime only — the port the `serve` process inside the container
      # actually listens on (frontend/Dockerfile's CMD). Unrelated to the
      # VITE_* build args above; matches BACKEND_PORT's existing
      # dual-purpose pattern (same value used as both the in-container
      # listen port and the host port mapping below).
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    # Deliberately NOT on vektra_internal: the frontend is static assets
    # served to a user's browser, not a container that talks to `db` or
    # `backend` over the internal network — the browser calls the
    # backend directly via its host-published port (VITE_API_BASE_URL
    # above), per the Docker & Deployment engineering review's networking
    # finding (item 9). Compose places it on its own default network.
    restart: on-failure
    # Same signal-handling rationale as `backend` — see frontend/Dockerfile's
    # own note on why its CMD uses `exec` and still benefits from tini.
    init: true
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  vektra_internal:
    driver: bridge

volumes:
  pgdata:
